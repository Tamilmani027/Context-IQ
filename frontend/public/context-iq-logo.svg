<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <!-- Gradients -->
        <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <linearGradient id="netGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#60a5fa" />
        </linearGradient>
        
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Transparent Background -->
    <rect width="100%" height="100%" fill="none"/>
    <!-- LOGO MARK GROUP -->
    <g transform="translate(100, 40)">
        <!-- Left Page Base -->
        <path d="M 20 180 C 20 100, 30 70, 95 80 L 95 180 C 30 170, 20 180, 20 180 Z" fill="url(#bookGrad)" opacity="0.15"/>
        <path d="M 20 170 C 20 90, 35 65, 95 75 L 95 165 C 35 155, 20 170, 20 170 Z" fill="white" stroke="url(#bookGrad)" stroke-width="4" stroke-linejoin="round"/>
        
        <!-- Right Page Base -->
        <path d="M 180 180 C 180 100, 170 70, 105 80 L 105 180 C 170 170, 180 180, 180 180 Z" fill="url(#bookGrad)" opacity="0.15"/>
        <path d="M 180 170 C 180 90, 165 65, 105 75 L 105 165 C 165 155, 180 170, 180 170 Z" fill="white" stroke="url(#bookGrad)" stroke-width="4" stroke-linejoin="round"/>
        
        <!-- Main Spine/Cover Anchor -->
        <path d="M 16 173 C 16 93, 35 60, 100 70 C 165 60, 184 93, 184 173 C 184 173, 165 158, 100 168 C 35 158, 16 173, 16 173 Z" fill="none" stroke="url(#bookGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 100 70 L 100 168" fill="none" stroke="url(#bookGrad)" stroke-width="4"/>
        <!-- Network/IQ Brain Nodes -->
        <g stroke="url(#netGrad)" stroke-width="2" stroke-linecap="round">
            <line x1="100" y1="70" x2="120" y2="40" />
            <line x1="120" y1="40" x2="155" y2="45" />
            <line x1="155" y1="45" x2="170" y2="75" />
            <line x1="170" y1="75" x2="160" y2="110" />
            <line x1="160" y1="110" x2="125" y2="115" />
            <line x1="125" y1="115" x2="100" y2="95" />
            
            <line x1="100" y1="70" x2="155" y2="45" />
            <line x1="120" y1="40" x2="125" y2="115" />
            <line x1="100" y1="95" x2="155" y2="45" />
            <line x1="125" y1="115" x2="170" y2="75" />
            
            <!-- Magnifying Glass Handle -->
            <line x1="150" y1="105" x2="185" y2="140" stroke="url(#netGrad)" stroke-width="6" />
        </g>
        
        <!-- Node Dots with Glow -->
        <g fill="url(#netGrad)" filter="url(#glow)">
            <circle cx="100" cy="70" r="5" />
            <circle cx="120" cy="40" r="5" />
            <circle cx="155" cy="45" r="5" />
            <circle cx="170" cy="75" r="5" />
            <circle cx="160" cy="110" r="5" />
            <circle cx="125" cy="115" r="5" />
            <circle cx="100" cy="95" r="5" />
        </g>
        
        <circle cx="100" cy="70" r="2" fill="white" filter="url(#glow)"/>
    </g>
    <!-- TYPOGRAPHY -->
    <text x="200" y="280" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="36" 
          font-weight="800" 
          text-anchor="middle" 
          letter-spacing="-0.5">
        <tspan fill="#0f172a">Context-</tspan>
        <tspan fill="#f97316">IQ</tspan>
    </text>
    
    <text x="200" y="305" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#64748b" 
          text-anchor="middle" 
          letter-spacing="2">
        DOCUMENT INTELLIGENCE
    </text>
</svg>
